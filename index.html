<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fryzen Platform</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0f0f0f;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      border-bottom: 1px solid #282828;
      background: #181818;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .logo span {
      color: #ff0000;
    }

    button {
      background: #ff0000;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 30px;
    }

    h1 {
      font-size: 32px;
    }

    .upload {
      margin: 25px 0;
      padding: 25px;
      background: #181818;
      border-radius: 15px;
    }

    input[type="file"] {
      margin-top: 15px;
    }

    #videoContainer {
      margin-top: 30px;
    }

    video {
      width: 100%;
      max-width: 800px;
      border-radius: 15px;
      background: black;
    }

    .info {
      margin-top: 15px;
      color: #aaa;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    ▶ <span>Fryzen</span> Platform
  </div>

  <button onclick="createChannel()">
    إنشاء قناة
  </button>
</header>

<main>

  <h1>مرحبًا بك في Fryzen Platform</h1>

  <div class="upload">
    <h2>رفع فيديو تجريبي</h2>

    <input
      type="file"
      id="videoInput"
      accept="video/*"
    >

    <br><br>

    <button onclick="uploadVideo()">
      رفع الفيديو
    </button>
  </div>

  <div id="videoContainer"></div>

</main>

<script>

function createChannel() {
  alert("تم إنشاء قناة تجريبية!");
}

function uploadVideo() {

  const input = document.getElementById("videoInput");
  const container = document.getElementById("videoContainer");

  if (!input.files.length) {
    alert("اختر فيديو أولاً");
    return;
  }

  const file = input.files[0];

  const videoURL = URL.createObjectURL(file);

  container.innerHTML = `
    <h2>${file.name}</h2>

    <video controls>
      <source src="${videoURL}" type="${file.type}">
      متصفحك لا يدعم الفيديو.
    </video>

    <div class="info">
      فيديو تجريبي على Fryzen Platform
    </div>
  `;
}

</script>

</body>
</html>
